<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中秋快乐</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('ty.ttf') format('truetype');
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'CustomFont', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #canvas {
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * 1.3888);
            max-height: calc(100vw * 0.7200);
            object-fit: contain;
            display: block;
        }

        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.6s ease;
        }
        .moon-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }
        .start-text {
            color: #FFF066;
            font-size: 22px;
            letter-spacing: 3px;
            font-weight: bold;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        #player-ui {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 24px 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
            transition: opacity 0.4s ease;
            opacity: 0;
            pointer-events: none;
        }
        #player-ui.active {
            opacity: 1;
            pointer-events: auto;
        }

        .progress-container {
            position: relative;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 3px;
            cursor: pointer;
            transition: height 0.15s ease;
        }
        .progress-container:hover {
            height: 8px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #f688a7;
            border-radius: 3px;
            position: relative;
        }
        .progress-handle {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%) scale(0);
            width: 12px;
            height: 12px;
            background: #FFF;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.5);
            transition: transform 0.15s ease;
        }
        .progress-container:hover .progress-handle {
            transform: translateY(-50%) scale(1);
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #fff;
        }
        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: transform 0.1s ease, color 0.2s;
        }
        .btn:hover {
            color: #FFF066;
            transform: scale(1.1);
        }
        .btn:active {
            transform: scale(0.95);
        }

        .time-display {
            font-size: 13px;
            font-family: -apple-system, sans-serif;
            color: rgba(255, 255, 255, 0.85);
            font-variant-numeric: tabular-nums;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .volume-slider {
            width: 70px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div class="moon-icon">🌕</div>
        <div class="start-text">点击开启中秋祝福</div>
    </div>

    <canvas id="canvas"></canvas>
    <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>

    <div id="player-ui">
        <div class="progress-container" id="progress-container" onclick="seek(event)">
            <div class="progress-bar" id="progress-bar">
                <div class="progress-handle"></div>
            </div>
        </div>
        <div class="controls-row">
            <div class="controls-left">
                <button class="btn" id="play-btn" onclick="togglePlay()">
                    <span id="play-icon">❚❚</span>
                </button>
                <div class="volume-container">
                    <button class="btn" onclick="toggleMute()">
                        <span id="volume-icon">🔊</span>
                    </button>
                    <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.02" value="0.5" oninput="changeVolume(this.value)">
                </div>
                <div class="time-display">
                    <span id="current-time">00:00</span> / <span id="total-time">01:17</span>
                </div>
            </div>
            <div class="controls-right">
                <button class="btn" onclick="toggleFullscreen()" title="横屏/全屏切换">
                    <span>⛶</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ================= 参数配置（与最新版 Python 100% 精确同步） =================
        const WIDTH = 1000;
        const HEIGHT = 720;
        const FPS = 60;

        const FONT_SIZE_MATRIX = 25;
        const MATRIX_COL_SPACING = 2.8;
        const MATRIX_SPEED_MIN = 0.2;
        const MATRIX_SPEED_MAX = 1.0;
        const FADE_TRAIL_ALPHA = 22 / 255;
        const MATRIX_CHARS = "但愿人长久，千里共婵娟。若可，我愿与你共婵娟，也共人间烟火";
        const MATRIX_CHAR_MUTATE_RATE = 0.08;

        const HEX_COLORS_RAIN = ["#6e9dad", "#b36879", "#ad9a50", "#afaaaa"];
        const HEX_COLOR_HEART = "#f688a7";
        const HEX_COLOR_CENTER_TEXT = "#FFF066";
        const HEX_COLOR_FOREGROUND = "#c6e2ff";
        const HEX_COLOR_ENDING_TEXT = "#c6e2ff";

        const HEX_COLORS_SPARKS = ["#c6e2ff", "#FF85A1", "#FFE066", "#FFFFFF"];

        const MINI_HEART_SIZE = 12;
        const CENTER_PARTICLE_SIZE = 5; // 中心字独立精巧微雕粒子（不糊）
        const HEART_SCALE = 16;
        const HEART_THICKNESS = 3;

        // 爱心扩散火花参数
        const SPARK_COUNT = 19;
        const SPARK_SIZE_MIN = 5;
        const SPARK_SIZE_MAX = 20;
        const SPARK_SPEED_MIN = 1.2;
        const SPARK_SPEED_MAX = 2.7;
        const SPARK_LIFE = 55;
        const SPARK_DRAG = 0.96;
        const SPARK_SPREAD_ANGLE = 0.6;

        const HEART_SWAY_AMP_X = 17.0;
        const HEART_SWAY_AMP_Y = 11.0;
        const HEART_SWAY_SPEED = 0.020;

        const FONT_SIZE_LARGE = 190;
        const FONT_SIZE_CENTER = 48; // 爱心中文字号（统一48px）

        const FOREGROUND_TEXTS = [
            "3", "2", "1",
            "亲爱的",
            "见字如面",
            "今夕何夕",
            "月满中秋",
            "祝 你",
            "中秋快乐",
            "所念皆所愿",
            "所行皆坦途",
            "与你",
            "皓月同心",
            "共赴婵娟",
            "愿我如星君如月",
            "夜夜流光相皎洁",
            "月亮是天空的情书",
            "你是我的已读心动",
            "中秋月圆",
            "愿往后年年良辰",
            "皆与你相伴"
        ];

        const FOREGROUND_DURATIONS = [
            70, 70, 70,
            100, 105, 105, 105, 105, 105,
            120, 120, 100, 120, 120,
            150, 150, 155, 155, 135, 140, 150
        ];

        const TARGET_TOTAL_SECONDS = 77; // 1分17秒
        const TARGET_TOTAL_FRAMES = TARGET_TOTAL_SECONDS * FPS; // 4620 帧

        const ENDING_TEXT = "今夜月明人尽望\n我的秋思只落你身上";
        const FONT_SIZE_ENDING = 54;
        const CHAR_APPEAR_INTERVAL = 10;
        const ENDING_DURATION = 312;

        const HEART_DURATION = TARGET_TOTAL_FRAMES - FOREGROUND_DURATIONS.reduce((a, b) => a + b, 0) - ENDING_DURATION;
        const STATE_DURATIONS = [...FOREGROUND_DURATIONS, HEART_DURATION, ENDING_DURATION];
        const TOTAL_FRAMES = TARGET_TOTAL_FRAMES;

        // 水印配置
        const WATERMARK_LINE1 = "-To my love";
        const WATERMARK_LINE2 = '"kxx"';
        const WATERMARK_FONT_SIZE_L1 = 20;
        const WATERMARK_FONT_SIZE_L2 = 17;
        const WATERMARK_OFFSET_RIGHT = 22;
        const WATERMARK_OFFSET_BOTTOM = 17;

        // ================= 2K Retina 超清画布 =================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bgm = document.getElementById('bgm');

        const DPR = Math.max(window.devicePixelRatio || 1, 2.0);
        canvas.width = WIDTH * DPR;
        canvas.height = HEIGHT * DPR;

        // 【核心工具】：原生 Canvas 矢量小爱心绘制器（彻底替代圆点！）
        function drawMiniHeart(c, x, y, size, color, alpha = 1.0) {
            c.save();
            c.globalAlpha = alpha;
            c.fillStyle = color;
            c.beginPath();
            const r = size / 4.0;
            // 左上半心
            c.arc(x - r, y - r * 0.8, r, Math.PI, 0, false);
            // 右上半心
            c.arc(x + r, y - r * 0.8, r, Math.PI, 0, false);
            // 下尖角
            c.lineTo(x, y + size * 0.55);
            c.closePath();
            c.fill();
            c.restore();
        }

        function createHeartCanvas(size, color) {
            const hCanvas = document.createElement('canvas');
            hCanvas.width = size * DPR;
            hCanvas.height = size * DPR;
            const hCtx = hCanvas.getContext('2d');
            hCtx.scale(DPR, DPR);
            drawMiniHeart(hCtx, size / 2, size / 2 - 1, size, color, 1.0);
            return hCanvas;
        }

        const heartTexture = createHeartCanvas(MINI_HEART_SIZE, HEX_COLOR_HEART);
        const centerTextTexture = createHeartCanvas(CENTER_PARTICLE_SIZE, HEX_COLOR_CENTER_TEXT);

        // ================= 代码雨 =================
        class MatrixRain {
            constructor() {
                this.cols = Math.floor(WIDTH / MATRIX_COL_SPACING);
                this.drops = Array.from({ length: this.cols }, () => -Math.random() * 40);
                this.speeds = Array.from({ length: this.cols }, () => MATRIX_SPEED_MIN + Math.random() * (MATRIX_SPEED_MAX - MATRIX_SPEED_MIN));
                this.colColors = Array.from({ length: this.cols }, () => HEX_COLORS_RAIN[Math.floor(Math.random() * HEX_COLORS_RAIN.length)]);
                this.colChars = Array.from({ length: this.cols }, () => MATRIX_CHARS[Math.floor(Math.random() * MATRIX_CHARS.length)]);
            }
            draw() {
                ctx.fillStyle = `rgba(0, 0, 0, ${FADE_TRAIL_ALPHA})`;
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
                ctx.font = `${FONT_SIZE_MATRIX}px 'CustomFont', sans-serif`;
                for (let i = 0; i < this.cols; i++) {
                    if (Math.random() < MATRIX_CHAR_MUTATE_RATE) {
                        this.colChars[i] = MATRIX_CHARS[Math.floor(Math.random() * MATRIX_CHARS.length)];
                    }
                    ctx.fillStyle = this.colColors[i];
                    ctx.fillText(this.colChars[i], i * MATRIX_COL_SPACING, this.drops[i] * FONT_SIZE_MATRIX);
                    if (this.drops[i] * FONT_SIZE_MATRIX > HEIGHT && Math.random() > 0.96) {
                        this.drops[i] = 0;
                        this.colColors[i] = HEX_COLORS_RAIN[Math.floor(Math.random() * HEX_COLORS_RAIN.length)];
                    }
                    this.drops[i] += this.speeds[i] * 0.18;
                }
            }
        }

        // ================= 粒子采样辅助 =================
        function sampleText(text, fontSize, step) {
            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            offCtx.font = `bold ${fontSize}px 'CustomFont', sans-serif`;
            const metrics = offCtx.measureText(text);
            const w = Math.ceil(metrics.width) + 30, h = Math.ceil(fontSize * 1.3);
            offCanvas.width = w; offCanvas.height = h;
            offCtx.font = `bold ${fontSize}px 'CustomFont', sans-serif`;
            offCtx.fillStyle = '#FFFFFF';
            offCtx.fillText(text, 15, fontSize);

            const imgData = offCtx.getImageData(0, 0, w, h).data;
            const points = [];
            const intStep = Math.max(1, Math.floor(step));
            for (let x = 0; x < w; x += intStep) {
                for (let y = 0; y < h; y += intStep) {
                    if (imgData[(y * w + x) * 4 + 3] > 120) {
                        points.push({ x: WIDTH / 2 - w / 2 + x, y: HEIGHT / 2 - h / 2 + y });
                    }
                }
            }
            return points;
        }

        function sampleDynamicForegroundText(text) {
            const cleanLen = text.replace(/\s+/g, "").length;
            let targetSize = FONT_SIZE_LARGE;
            if (cleanLen >= 10) targetSize = Math.floor(FONT_SIZE_LARGE * 0.44);
            else if (cleanLen >= 8) targetSize = Math.floor(FONT_SIZE_LARGE * 0.52);
            else if (cleanLen >= 7) targetSize = Math.floor(FONT_SIZE_LARGE * 0.60);
            else if (cleanLen >= 5) targetSize = Math.floor(FONT_SIZE_LARGE * 0.72);
            else if (cleanLen === 4) targetSize = Math.floor(FONT_SIZE_LARGE * 0.85);

            return sampleText(text, targetSize, 4);
        }

        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: WIDTH / 2 + x * scale, y: HEIGHT / 2 + y * scale - 25 };
        }

        function randomGaussian(mean, stdev) {
            let u = 1 - Math.random(), v = Math.random();
            return mean + Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v) * stdev;
        }

        // ================= 主粒子系统 =================
        class SuperParticleSystem {
            constructor() {
                this.particles = [];
                this.sparks = [];
                this.isHeartMode = false;
                this.isEndingMode = false;
                this.heartBorderPoints = [];
                this.heartPulse = 0;
                this.swayTimer = 0;
                this.endingTimer = 0;
                this.endingCharData = [];
            }

            prepareEndingText() {
                this.endingTimer = 0;
                this.endingCharData = [];
                const lines = ENDING_TEXT.split('\n');
                const lineSpacing = 26;
                const totalH = lines.length * FONT_SIZE_ENDING + (lines.length - 1) * lineSpacing;
                let curY = HEIGHT / 2 - totalH / 2;
                ctx.font = `bold ${FONT_SIZE_ENDING}px 'CustomFont', sans-serif`;
                let globalCharIdx = 0;

                lines.forEach((line, lineIdx) => {
                    const lineW = ctx.measureText(line).width;
                    let curX = WIDTH / 2 - lineW / 2;
                    const pause = lineIdx > 0 ? 15 : 0;
                    for (let ch of line) {
                        const cw = ctx.measureText(ch).width;
                        this.endingCharData.push({
                            char: ch, x: curX, y: curY + FONT_SIZE_ENDING,
                            startFrame: globalCharIdx * CHAR_APPEAR_INTERVAL + pause
                        });
                        curX += cw;
                        globalCharIdx++;
                    }
                    curY += FONT_SIZE_ENDING + lineSpacing;
                });
            }

            setTarget(stateIdx) {
                const numTexts = FOREGROUND_TEXTS.length;
                this.isHeartMode = (stateIdx === numTexts);
                this.isEndingMode = (stateIdx === numTexts + 1);
                const targets = [];

                if (stateIdx < numTexts) {
                    const pts = sampleDynamicForegroundText(FOREGROUND_TEXTS[stateIdx]);
                    pts.forEach(pt => targets.push({ x: pt.x, y: pt.y, type: 'normal' }));
                } else if (this.isHeartMode) {
                    this.heartBorderPoints = [];
                    for (let i = 0; i < 1300; i++) {
                        const t = Math.random() * Math.PI * 2;
                        const scaleOffset = randomGaussian(0, HEART_THICKNESS * 0.45);
                        const s = HEART_SCALE + scaleOffset;
                        const pt = getHeartPoint(t, s);
                        targets.push({ x: pt.x, y: pt.y, type: 'heart' });
                        if (Math.abs(scaleOffset) < 0.8) this.heartBorderPoints.push(pt);
                    }
                    // 双行 48px 对称居中
                    const ptsTop = sampleText("中秋快乐", FONT_SIZE_CENTER, 3);
                    ptsTop.forEach(pt => targets.push({ x: pt.x, y: pt.y - 28, type: 'text' }));
                    const ptsSub = sampleText("不止中秋", FONT_SIZE_CENTER, 3);
                    ptsSub.forEach(pt => targets.push({ x: pt.x, y: pt.y + 28, type: 'text' }));
                } else if (this.isEndingMode) {
                    this.prepareEndingText();
                    this.particles.forEach(p => {
                        const angle = Math.atan2(p.y - (HEIGHT / 2 - 25), p.x - WIDTH / 2) + (Math.random() - 0.5) * 0.8;
                        const spd = 1.5 + Math.random() * 3.5;
                        p.vx = Math.cos(angle) * spd;
                        p.vy = Math.sin(angle) * spd;
                        p.alpha = 255.0;
                        p.decay = 1.2 + Math.random() * 1.6;
                        p.type = 'stardust';
                        p.color = HEX_COLORS_SPARKS[Math.floor(Math.random() * HEX_COLORS_SPARKS.length)];
                    });
                    return;
                }

                while (this.particles.length < targets.length) {
                    this.particles.push({ x: Math.random() * WIDTH, y: Math.random() * HEIGHT, type: 'normal' });
                }
                if (this.particles.length > targets.length) {
                    this.particles = this.particles.slice(0, targets.length);
                }

                targets.sort(() => Math.random() - 0.5);
                targets.forEach((pt, i) => {
                    this.particles[i].tx = pt.x;
                    this.particles[i].ty = pt.y;
                    this.particles[i].type = pt.type;
                });
            }

            draw() {
                let swayX = 0, swayY = 0, pulse = 0;
                if (this.isHeartMode) {
                    this.swayTimer += HEART_SWAY_SPEED;
                    swayX = Math.sin(this.swayTimer) * HEART_SWAY_AMP_X;
                    swayY = Math.cos(this.swayTimer * 0.7) * HEART_SWAY_AMP_Y;
                    pulse = Math.sin(this.heartPulse) * 3.5;
                    this.heartPulse += 0.08;
                }

                if (this.isEndingMode) {
                    this.particles.forEach(p => {
                        if (p.alpha > 0) {
                            p.x += p.vx; p.y += p.vy;
                            p.vx *= 0.985; p.vy *= 0.985;
                            p.alpha = Math.max(0, p.alpha - p.decay);
                            ctx.globalAlpha = p.alpha / 255;
                            ctx.fillStyle = p.color;
                            ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2); ctx.fill();
                            ctx.globalAlpha = 1.0;
                        }
                    });
                } else {
                    this.particles.forEach(p => {
                        p.x += (p.tx - p.x) * 0.08 + (Math.random() - 0.5);
                        p.y += (p.ty - p.y) * 0.08 + (Math.random() - 0.5);
                        const fx = p.x + swayX, fy = p.y + swayY + pulse;

                        if (p.type === 'heart') {
                            ctx.drawImage(heartTexture, fx - MINI_HEART_SIZE / 2, fy - MINI_HEART_SIZE / 2, MINI_HEART_SIZE, MINI_HEART_SIZE);
                        } else if (p.type === 'text') {
                            ctx.drawImage(centerTextTexture, fx - CENTER_PARTICLE_SIZE / 2, fy - CENTER_PARTICLE_SIZE / 2, CENTER_PARTICLE_SIZE, CENTER_PARTICLE_SIZE);
                        } else {
                            ctx.fillStyle = HEX_COLOR_FOREGROUND;
                            ctx.beginPath(); ctx.arc(fx, fy, 2.2, 0, Math.PI * 2); ctx.fill();
                        }
                    });
                }

                // 2. 爱心扩散火花生成
                if (this.isHeartMode && this.heartBorderPoints.length > 0) {
                    for (let i = 0; i < SPARK_COUNT; i++) {
                        const bp = this.heartBorderPoints[Math.floor(Math.random() * this.heartBorderPoints.length)];
                        const angle = Math.atan2(bp.y - (HEIGHT / 2 - 25), bp.x - WIDTH / 2);
                        const spd = randomUniform(SPARK_SPEED_MIN, SPARK_SPEED_MAX);
                        this.sparks.push({
                            x: bp.x + swayX, y: bp.y + swayY,
                            vx: Math.cos(angle) * spd + randomUniform(-SPARK_SPREAD_ANGLE, SPARK_SPREAD_ANGLE),
                            vy: Math.sin(angle) * spd + randomUniform(-SPARK_SPREAD_ANGLE, SPARK_SPREAD_ANGLE),
                            life: SPARK_LIFE, maxLife: SPARK_LIFE,
                            size: randomUniform(SPARK_SIZE_MIN, SPARK_SIZE_MAX),
                            color: HEX_COLORS_SPARKS[Math.floor(Math.random() * HEX_COLORS_SPARKS.length)]
                        });
                    }
                }

                // 【核心彻底修复】：火花绘制由原先的圆圈换成真正的矢量小爱心！
                for (let i = this.sparks.length - 1; i >= 0; i--) {
                    const s = this.sparks[i];
                    s.x += s.vx; s.y += s.vy;
                    s.vx *= SPARK_DRAG; s.vy *= SPARK_DRAG;
                    s.life--;
                    if (s.life <= 0) {
                        this.sparks.splice(i, 1);
                    } else {
                        const alpha = s.life / s.maxLife;
                        // 这里直接调用专属爱心绘制器，向外喷射漫天小爱心！
                        drawMiniHeart(ctx, s.x, s.y, s.size, s.color, alpha);
                    }
                }

                if (this.isEndingMode) {
                    this.endingTimer++;
                    ctx.font = `bold ${FONT_SIZE_ENDING}px 'CustomFont', sans-serif`;
                    ctx.fillStyle = HEX_COLOR_ENDING_TEXT;
                    this.endingCharData.forEach(item => {
                        if (this.endingTimer >= item.startFrame) {
                            const progress = Math.min(1.0, (this.endingTimer - item.startFrame) / 15.0);
                            ctx.globalAlpha = progress;
                            ctx.fillText(item.char, item.x, item.y - (1.0 - progress) * 4.0);
                            ctx.globalAlpha = 1.0;
                        }
                    });
                }
            }
        }

        function randomUniform(min, max) { return min + Math.random() * (max - min); }

        // ================= 播放器控制器 =================
        const rain = new MatrixRain();
        const system = new SuperParticleSystem();
        system.setTarget(0);

        let curState = 0, timer = 0, fadeAlpha = 0, isFadingIn = true;
        let isPlaying = false, isStarted = false;
        let userVolume = 0.5;

        function applyVolume(vol) {
            try {
                if (bgm) bgm.volume = Math.max(0, Math.min(1, vol));
            } catch(e) {}
        }

        function getGlobalFrame() {
            let sum = 0;
            for (let i = 0; i < curState; i++) sum += STATE_DURATIONS[i];
            return sum + timer;
        }

        function jumpToGlobalFrame(targetFrame) {
            let acc = 0;
            for (let i = 0; i < STATE_DURATIONS.length; i++) {
                if (targetFrame < acc + STATE_DURATIONS[i] || i === STATE_DURATIONS.length - 1) {
                    curState = i;
                    timer = targetFrame - acc;
                    system.setTarget(curState);
                    break;
                }
                acc += STATE_DURATIONS[i];
            }
            if (bgm && bgm.duration) {
                try { bgm.currentTime = (targetFrame / TOTAL_FRAMES) * bgm.duration; } catch(e) {}
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        const playerUI = document.getElementById('player-ui');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const playIcon = document.getElementById('play-icon');
        const volumeIcon = document.getElementById('volume-icon');
        const volumeSlider = document.getElementById('volume-slider');
        let hideUITimer = null;

        function showUI() {
            if (!isStarted) return;
            playerUI.classList.add('active');
            clearTimeout(hideUITimer);
            hideUITimer = setTimeout(() => {
                if (isPlaying) playerUI.classList.remove('active');
            }, 3000);
        }

        window.addEventListener('mousemove', showUI);
        window.addEventListener('touchstart', showUI, { passive: true });

        function togglePlay() {
            if (!isStarted) return;
            isPlaying = !isPlaying;
            if (isPlaying) {
                lastTime = performance.now();
                if (bgm) bgm.play().catch(() => {});
                playIcon.innerText = '❚❚';
            } else {
                if (bgm) bgm.pause();
                playIcon.innerText = '▶';
                playerUI.classList.add('active');
            }
        }

        canvas.addEventListener('click', () => { if (isStarted) togglePlay(); });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
        });

        function seek(e) {
            const rect = document.getElementById('progress-container').getBoundingClientRect();
            const clickX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
            const ratio = clickX / rect.width;
            jumpToGlobalFrame(Math.floor(ratio * TOTAL_FRAMES));

            if (!isPlaying) {
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
                rain.draw();
                system.draw();
                drawWatermark(0.02);
                const curFrame = getGlobalFrame();
                progressBar.style.width = `${(curFrame / TOTAL_FRAMES) * 100}%`;
                currentTimeEl.innerText = formatTime(curFrame / FPS);
            }
        }

        function changeVolume(val) {
            userVolume = parseFloat(val);
            if (bgm) bgm.muted = false;
            volumeIcon.innerText = userVolume === 0 ? '🔇' : '🔊';
        }

        function toggleMute() {
            if (userVolume === 0) {
                userVolume = 0.5;
                volumeSlider.value = 0.5;
                volumeIcon.innerText = '🔊';
            } else {
                userVolume = 0;
                volumeSlider.value = 0;
                volumeIcon.innerText = '🔇';
            }
        }

        async function toggleFullscreen() {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(() => {});
                    }
                } else {
                    if (document.exitFullscreen) await document.exitFullscreen();
                }
            } catch (err) {}
        }

        // ================= 双行专属水印绘制 =================
        let watermarkTime = 0;
        function drawWatermark(forceAlpha = null) {
            watermarkTime += 0.02;
            const normSin = (Math.sin(watermarkTime) + 1.0) / 2.0;
            // 极低调微光（对应 Python 的 Alpha 2~5 级别）
            const alpha = forceAlpha !== null ? forceAlpha : (0.010 + normSin * 0.015);

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#c6e2ff';

            ctx.font = `${WATERMARK_FONT_SIZE_L1}px 'CustomFont', sans-serif`;
            const w1 = ctx.measureText(WATERMARK_LINE1).width;
            ctx.font = `${WATERMARK_FONT_SIZE_L2}px 'CustomFont', sans-serif`;
            const w2 = ctx.measureText(WATERMARK_LINE2).width;

            const maxW = Math.max(w1, w2);
            const posX = WIDTH - maxW - WATERMARK_OFFSET_RIGHT;
            const posY = HEIGHT - WATERMARK_OFFSET_BOTTOM - 24;

            ctx.font = `${WATERMARK_FONT_SIZE_L1}px 'CustomFont', sans-serif`;
            ctx.fillText(WATERMARK_LINE1, posX + (maxW - w1) / 2, posY);

            ctx.font = `${WATERMARK_FONT_SIZE_L2}px 'CustomFont', sans-serif`;
            ctx.fillText(WATERMARK_LINE2, posX + (maxW - w2) / 2, posY + 20);

            ctx.restore();
        }

        // ================= 严格锁帧主循环 =================
        const TARGET_FPS = 60, FRAME_INTERVAL = 1000 / TARGET_FPS;
        let lastTime = performance.now();

        function animate(currentTime = performance.now()) {
            requestAnimationFrame(animate);
            if (!isPlaying) return;

            const elapsed = currentTime - lastTime;
            if (elapsed < FRAME_INTERVAL) return;
            lastTime = currentTime - (elapsed % FRAME_INTERVAL);

            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            timer++;

            // 帧驱动平滑音量衰减
            const endingIdx = FOREGROUND_TEXTS.length + 1;
            if (curState === endingIdx) {
                const fadeProgress = Math.min(1.0, timer / 150.0);
                applyVolume(userVolume * (1.0 - fadeProgress));
            } else {
                applyVolume(userVolume);
            }

            if (timer > STATE_DURATIONS[curState]) {
                if (curState < STATE_DURATIONS.length - 1) {
                    timer = 0;
                    curState++;
                    system.setTarget(curState);
                } else {
                    fadeAlpha += 0.02;
                    if (fadeAlpha >= 1.0) {
                        curState = 0; timer = 0;
                        system.setTarget(0);
                        if (bgm) {
                            try { bgm.currentTime = 0; } catch(e) {}
                            applyVolume(userVolume);
                            bgm.play().catch(() => {});
                        }
                        isFadingIn = true;
                    }
                }
            }

            if (isFadingIn) {
                fadeAlpha -= 0.02;
                if (fadeAlpha <= 0) { fadeAlpha = 0; isFadingIn = false; }
            }

            const curFrame = getGlobalFrame();
            progressBar.style.width = `${(curFrame / TOTAL_FRAMES) * 100}%`;
            currentTimeEl.innerText = formatTime(curFrame / FPS);
            totalTimeEl.innerText = formatTime(TOTAL_FRAMES / FPS);

            rain.draw();
            system.draw();
            drawWatermark();

            if (fadeAlpha > 0) {
                ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(1.0, fadeAlpha)})`;
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
            }
        }

        // ================= 启动逻辑 =================
        function startApp() {
            if (isStarted) return;
            isStarted = true;
            isPlaying = true;

            const overlay = document.getElementById('start-overlay');
            if (overlay) {
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; }, 600);
            }

            applyVolume(userVolume);
            if (bgm) {
                const p = bgm.play();
                if (p && p.catch) p.catch(() => {});
            }

            showUI();
            lastTime = performance.now();
            requestAnimationFrame(animate);
        }

        const overlayEl = document.getElementById('start-overlay');
        overlayEl.addEventListener('click', startApp);
        overlayEl.addEventListener('touchend', (e) => {
            e.preventDefault();
            startApp();
        }, { passive: false });
    </script>
</body>
</html>
