<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中秋快乐</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('ty.ttf') format('truetype');
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'CustomFont', -apple-system, sans-serif;
        }
        /* 核心：等比自适应投影，保证 1000x720 比例完美还原，不拉伸不变形 */
        #canvas {
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (1000 / 720));
            max-height: calc(100vw * (720 / 1000));
            object-fit: contain;
            display: block;
        }
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        .moon-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }
        .start-text {
            color: #FFF066;
            font-size: 20px;
            letter-spacing: 2px;
            font-weight: bold;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="start-overlay" onclick="startApp()">
        <div class="moon-icon">🌕</div>
        <div class="start-text">点击开启中秋祝福</div>
    </div>

    <!-- 内部渲染分辨率锁定为 1000 x 720 -->
    <canvas id="canvas" width="1000" height="720"></canvas>
    <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>

    <script>
        // ==============================================================================
        //           【参数配置：与 VS 里的 Python 代码完全保持 100% 精确一致】
        // ==============================================================================
        const WIDTH = 1000;
        const HEIGHT = 720;
        const FPS = 60;

        // A. 背景代码雨独立配置
        const FONT_SIZE_MATRIX = 20;           // 代码雨字号 (与VS一致)
        const MATRIX_COL_SPACING = 3;          // 列间距 3 (与VS一致，致密震撼)
        const MATRIX_SPEED_MIN = 0.3;          // 最小速度 (与VS一致)
        const MATRIX_SPEED_MAX = 1.0;          // 最大速度 (与VS一致)
        const FADE_TRAIL_ALPHA = 25 / 255;     // 拖影透明度 (与VS一致)
        const MATRIX_CHARS = "中秋快乐皆如所愿阖家团圆岁岁平安月圆人圆";

        const HEX_COLORS_RAIN = ["#6e9dad", "#b36879", "#ad9a50", "#afaaaa"];

        // B. 爱心与爆发火花独立配置
        const HEX_COLOR_HEART = "#f688a7";
        const HEX_COLOR_CENTER_TEXT = "#FFF066";
        const HEX_COLORS_SPARKS = ["#6e9dad", "#FF85A1", "#FFE066", "#FFFFFF"];

        const MINI_HEART_SIZE = 7;             // 爱心小粒子大小 7 (与VS一致)
        const HEART_SCALE = 15;                // 爱心大小 15 (与VS一致)
        const HEART_THICKNESS = 3;             // 爱心厚度 3 (与VS一致)
        const HEART_BURST_COUNT = 15;          // 每帧爆发火花数量 15 (与VS一致)
        const HEART_BURST_SPEED = 2.0;         // 爆发初速度 2.0 (与VS一致)

        const HEART_SWAY_AMP_X = 17.0;         // 左右晃动幅度 17 (与VS一致)
        const HEART_SWAY_AMP_Y = 11.0;         // 上下晃动幅度 11 (与VS一致)
        const HEART_SWAY_SPEED = 0.020;        // 漂浮速度 0.02 (与VS一致)

        // C. 前景文字独立配置
        const FONT_SIZE_LARGE = 190;           // 倒计时、祝福语字号 190 (与VS一致)
        const FONT_SIZE_CENTER = 60;           // 爱心内部“中秋快乐”字号 60 (与VS一致)

        // D. 结束画面配置
        const ENDING_TEXT = "此生风月愿同携\n岁岁晨昏共执蹄";
        const FONT_SIZE_ENDING = 54;           // 结束语字号 54 (与VS一致)
        const HEX_COLOR_ENDING_TEXT = "#FFFFFF";
        const CHAR_APPEAR_INTERVAL = 10;
        const ENDING_DURATION = 312;

        // 状态持续时间
        const STATE_DURATIONS = [65, 65, 65, 90, 90, 110, 110, 3720, ENDING_DURATION];

        // ================= 初始化画布 =================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bgm = document.getElementById('bgm');

        // 生成迷你小爱心纹理 (大小与 VS 一致: 7px)
        function createHeartCanvas(size, color) {
            const hCanvas = document.createElement('canvas');
            hCanvas.width = size;
            hCanvas.height = size;
            const hCtx = hCanvas.getContext('2d');
            hCtx.fillStyle = color;
            const r = size / 4;
            hCtx.beginPath();
            hCtx.arc(r, r, r, Math.PI, 0, false);
            hCtx.arc(3 * r, r, r, Math.PI, 0, false);
            hCtx.lineTo(size / 2, size);
            hCtx.closePath();
            hCtx.fill();
            return hCanvas;
        }

        const heartTexture = createHeartCanvas(MINI_HEART_SIZE, HEX_COLOR_HEART);
        const centerTextTexture = createHeartCanvas(MINI_HEART_SIZE - 2, HEX_COLOR_CENTER_TEXT);

        // ================= 背景代码雨 (与 VS 逻辑 100% 对齐) =================
        class MatrixRain {
            constructor() {
                this.cols = Math.floor(WIDTH / MATRIX_COL_SPACING); // 约 333 列
                this.drops = Array.from({ length: this.cols }, () => -Math.random() * 40);
                this.speeds = Array.from({ length: this.cols }, () => MATRIX_SPEED_MIN + Math.random() * (MATRIX_SPEED_MAX - MATRIX_SPEED_MIN));
                this.colColors = Array.from({ length: this.cols }, () => HEX_COLORS_RAIN[Math.floor(Math.random() * HEX_COLORS_RAIN.length)]);
            }

            draw() {
                // 拖影透明度与 VS (25/255) 严格一致
                ctx.fillStyle = `rgba(0, 0, 0, ${FADE_TRAIL_ALPHA})`;
                ctx.fillRect(0, 0, WIDTH, HEIGHT);

                ctx.font = `${FONT_SIZE_MATRIX}px 'CustomFont', sans-serif`;
                for (let i = 0; i < this.cols; i++) {
                    const char = MATRIX_CHARS[Math.floor(Math.random() * MATRIX_CHARS.length)];
                    ctx.fillStyle = this.colColors[i];
                    
                    const x = i * MATRIX_COL_SPACING;
                    const y = this.drops[i] * FONT_SIZE_MATRIX;
                    ctx.fillText(char, x, y);

                    if (y > HEIGHT && Math.random() > 0.96) {
                        this.drops[i] = 0;
                        this.colColors[i] = HEX_COLORS_RAIN[Math.floor(Math.random() * HEX_COLORS_RAIN.length)];
                    }
                    this.drops[i] += this.speeds[i] * 0.18; // 0.18 步进完全一致
                }
            }
        }

        // ================= 粒子采样 =================
        function sampleText(text, fontSize, step) {
            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            offCtx.font = `bold ${fontSize}px 'CustomFont', sans-serif`;
            const metrics = offCtx.measureText(text);
            const w = Math.ceil(metrics.width) + 30;
            const h = Math.ceil(fontSize * 1.3);
            offCanvas.width = w;
            offCanvas.height = h;

            offCtx.font = `bold ${fontSize}px 'CustomFont', sans-serif`;
            offCtx.fillStyle = '#FFFFFF';
            offCtx.fillText(text, 15, fontSize);

            const imgData = offCtx.getImageData(0, 0, w, h).data;
            const points = [];
            for (let x = 0; x < w; x += step) {
                for (let y = 0; y < h; y += step) {
                    if (imgData[(y * w + x) * 4 + 3] > 120) {
                        points.push({
                            x: WIDTH / 2 - w / 2 + x,
                            y: HEIGHT / 2 - h / 2 + y
                        });
                    }
                }
            }
            return points;
        }

        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return {
                x: WIDTH / 2 + x * scale,
                y: HEIGHT / 2 + y * scale - 25
            };
        }

        // 高斯随机分布辅助 (模拟 Python 中的 random.gauss)
        function randomGaussian(mean, stdev) {
            let u = 1 - Math.random();
            let v = Math.random();
            let z = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
            return mean + z * stdev;
        }

        // ================= 主粒子系统 =================
        class SuperParticleSystem {
            constructor() {
                this.particles = [];
                this.sparks = [];
                this.isHeartMode = false;
                this.isEndingMode = false;
                this.heartBorderPoints = [];
                this.heartPulse = 0;
                this.swayTimer = 0;
                this.endingTimer = 0;
                this.endingCharData = [];
            }

            prepareEndingText() {
                this.endingTimer = 0;
                this.endingCharData = [];
                const lines = ENDING_TEXT.split('\n');
                const lineSpacing = 26;
                const totalH = lines.length * FONT_SIZE_ENDING + (lines.length - 1) * lineSpacing;
                let curY = HEIGHT / 2 - totalH / 2;

                ctx.font = `bold ${FONT_SIZE_ENDING}px 'CustomFont', sans-serif`;
                let globalCharIdx = 0;

                lines.forEach((line, lineIdx) => {
                    const lineW = ctx.measureText(line).width;
                    let curX = WIDTH / 2 - lineW / 2;
                    const pause = lineIdx > 0 ? 15 : 0;

                    for (let ch of line) {
                        const cw = ctx.measureText(ch).width;
                        this.endingCharData.push({
                            char: ch,
                            x: curX,
                            y: curY + FONT_SIZE_ENDING,
                            startFrame: globalCharIdx * CHAR_APPEAR_INTERVAL + pause
                        });
                        curX += cw;
                        globalCharIdx++;
                    }
                    curY += FONT_SIZE_ENDING + lineSpacing;
                });
            }

            setTarget(stateIdx) {
                this.isHeartMode = (stateIdx === 7);
                this.isEndingMode = (stateIdx === 8);
                const targets = [];

                if (this.isHeartMode) {
                    this.heartBorderPoints = [];
                    // 与 VS 完全一致：生成 1300 颗爱心粒子 + 高斯星云厚度分布
                    for (let i = 0; i < 1300; i++) {
                        const t = Math.random() * Math.PI * 2;
                        const scaleOffset = randomGaussian(0, HEART_THICKNESS * 0.45);
                        const s = HEART_SCALE + scaleOffset;
                        const pt = getHeartPoint(t, s);
                        targets.push({ x: pt.x, y: pt.y, type: 'heart' });
                        if (Math.abs(scaleOffset) < 0.8) {
                            this.heartBorderPoints.push(pt);
                        }
                    }
                    // 中心文字“中秋快乐” (字号 60, step=4)
                    const centerPts = sampleText("中秋快乐", FONT_SIZE_CENTER, 4);
                    centerPts.forEach(pt => targets.push({ x: pt.x, y: pt.y, type: 'text' }));
                } else if (this.isEndingMode) {
                    fadeAudio(bgm, 2500); // 音乐 2.5 秒精准淡出
                    this.prepareEndingText();

                    // 爱心粒子向外炸开化为星尘
                    this.particles.forEach(p => {
                        const angle = Math.atan2(p.y - (HEIGHT / 2 - 25), p.x - WIDTH / 2) + (Math.random() - 0.5) * 0.8;
                        const spd = 1.5 + Math.random() * 3.5;
                        p.vx = Math.cos(angle) * spd;
                        p.vy = Math.sin(angle) * spd;
                        p.alpha = 255.0;
                        p.decay = 1.2 + Math.random() * 1.6;
                        p.type = 'stardust';
                        p.color = HEX_COLORS_SPARKS[Math.floor(Math.random() * HEX_COLORS_SPARKS.length)];
                    });
                    return;
                } else {
                    const seq = ["3", "2", "1", "亲爱的", "祝 你", "中秋快乐", "岁岁无忧"];
                    // 大字字号 190, step=6 (与VS完全一致)
                    const pts = sampleText(seq[stateIdx], FONT_SIZE_LARGE, 6);
                    pts.forEach(pt => targets.push({ x: pt.x, y: pt.y, type: 'normal' }));
                }

                while (this.particles.length < targets.length) {
                    this.particles.push({ x: Math.random() * WIDTH, y: Math.random() * HEIGHT, type: 'normal' });
                }
                if (this.particles.length > targets.length) {
                    this.particles = this.particles.slice(0, targets.length);
                }

                targets.sort(() => Math.random() - 0.5);
                targets.forEach((pt, i) => {
                    this.particles[i].tx = pt.x;
                    this.particles[i].ty = pt.y;
                    this.particles[i].type = pt.type;
                });
            }

            draw() {
                let swayX = 0, swayY = 0, pulse = 0;
                if (this.isHeartMode) {
                    this.swayTimer += HEART_SWAY_SPEED;
                    swayX = Math.sin(this.swayTimer) * HEART_SWAY_AMP_X;
                    swayY = Math.cos(this.swayTimer * 0.7) * HEART_SWAY_AMP_Y;
                    pulse = Math.sin(this.heartPulse) * 3.5;
                    this.heartPulse += 0.08;
                }

                // 1. 绘制主体粒子
                if (this.isEndingMode) {
                    this.particles.forEach(p => {
                        if (p.alpha > 0) {
                            p.x += p.vx;
                            p.y += p.vy;
                            p.vx *= 0.985;
                            p.vy *= 0.985;
                            p.alpha = Math.max(0, p.alpha - p.decay);

                            ctx.globalAlpha = p.alpha / 255;
                            ctx.fillStyle = p.color;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.globalAlpha = 1.0;
                        }
                    });
                } else {
                    this.particles.forEach(p => {
                        p.x += (p.tx - p.x) * 0.08 + (Math.random() - 0.5);
                        p.y += (p.ty - p.y) * 0.08 + (Math.random() - 0.5);
                        const fx = p.x + swayX;
                        const fy = p.y + swayY + pulse;

                        if (p.type === 'heart') {
                            ctx.drawImage(heartTexture, fx - MINI_HEART_SIZE / 2, fy - MINI_HEART_SIZE / 2);
                        } else if (p.type === 'text') {
                            ctx.drawImage(centerTextTexture, fx - (MINI_HEART_SIZE - 2) / 2, fy - (MINI_HEART_SIZE - 2) / 2);
                        } else {
                            ctx.fillStyle = '#FFFFFF';
                            ctx.beginPath();
                            ctx.arc(fx, fy, 3, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });
                }

                // 2. 爱心爆发火花 (与VS完全一致：每帧15颗)
                if (this.isHeartMode && this.heartBorderPoints.length > 0) {
                    for (let i = 0; i < HEART_BURST_COUNT; i++) {
                        const bp = this.heartBorderPoints[Math.floor(Math.random() * this.heartBorderPoints.length)];
                        const angle = Math.atan2(bp.y - (HEIGHT / 2 - 25), bp.x - WIDTH / 2);
                        const spd = 1.2 + Math.random() * HEART_BURST_SPEED;
                        this.sparks.push({
                            x: bp.x + swayX,
                            y: bp.y + swayY,
                            vx: Math.cos(angle) * spd + (Math.random() - 0.5) * 0.4,
                            vy: Math.sin(angle) * spd + (Math.random() - 0.5) * 0.4,
                            life: 40,
                            maxLife: 40,
                            color: HEX_COLORS_SPARKS[Math.floor(Math.random() * HEX_COLORS_SPARKS.length)]
                        });
                    }
                }

                for (let i = this.sparks.length - 1; i >= 0; i--) {
                    const s = this.sparks[i];
                    s.x += s.vx;
                    s.y += s.vy;
                    s.vx *= 0.96;
                    s.vy *= 0.96;
                    s.life--;
                    if (s.life <= 0) {
                        this.sparks.splice(i, 1);
                    } else {
                        ctx.globalAlpha = s.life / s.maxLife;
                        ctx.fillStyle = s.color;
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.globalAlpha = 1.0;
                    }
                }

                // 3. 结束语逐字渐显 (原生矢量级清晰度)
                if (this.isEndingMode) {
                    this.endingTimer++;
                    ctx.font = `bold ${FONT_SIZE_ENDING}px 'CustomFont', sans-serif`;
                    ctx.fillStyle = HEX_COLOR_ENDING_TEXT;

                    this.endingCharData.forEach(item => {
                        if (this.endingTimer >= item.startFrame) {
                            const progress = Math.min(1.0, (this.endingTimer - item.startFrame) / 15.0);
                            ctx.globalAlpha = progress;
                            const offsetY = (1.0 - progress) * 4.0;
                            ctx.fillText(item.char, item.x, item.y - offsetY);
                            ctx.globalAlpha = 1.0;
                        }
                    });
                }
            }
        }

        // 音频渐隐函数
        function fadeAudio(audio, durationMs) {
            const startVol = audio.volume;
            const stepMs = 50;
            const steps = durationMs / stepMs;
            const volStep = startVol / steps;

            const interval = setInterval(() => {
                if (audio.volume > volStep) {
                    audio.volume -= volStep;
                } else {
                    audio.volume = 0;
                    clearInterval(interval);
                }
            }, stepMs);
        }

        // ================= 严格锁帧主循环 =================
        const rain = new MatrixRain();
        const system = new SuperParticleSystem();
        system.setTarget(0);

        let curState = 0;
        let timer = 0;
        let fadeAlpha = 0;
        let isFadingIn = true;
        let isStarted = false;

        const TARGET_FPS = 60;
        const FRAME_INTERVAL = 1000 / TARGET_FPS;
        let lastTime = performance.now();

        function animate(currentTime) {
            requestAnimationFrame(animate);

            const elapsed = currentTime - lastTime;
            if (elapsed < FRAME_INTERVAL) return;
            lastTime = currentTime - (elapsed % FRAME_INTERVAL);

            timer++;
            if (timer > STATE_DURATIONS[curState]) {
                if (curState < STATE_DURATIONS.length - 1) {
                    timer = 0;
                    curState++;
                    system.setTarget(curState);
                } else {
                    fadeAlpha += 0.02;
                    if (fadeAlpha >= 1.0) {
                        curState = 0;
                        timer = 0;
                        system.setTarget(0);
                        bgm.currentTime = 0;
                        bgm.volume = 0.5;
                        bgm.play();
                        isFadingIn = true;
                    }
                }
            }

            if (isFadingIn) {
                fadeAlpha -= 0.02;
                if (fadeAlpha <= 0) {
                    fadeAlpha = 0;
                    isFadingIn = false;
                }
            }

            rain.draw();
            system.draw();

            if (fadeAlpha > 0) {
                ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(1.0, fadeAlpha)})`;
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
            }
        }

        function startApp() {
            if (isStarted) return;
            isStarted = true;
            document.getElementById('start-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-overlay').style.display = 'none';
            }, 800);

            bgm.volume = 0.5;
            bgm.play().catch(() => {});
            lastTime = performance.now();
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
